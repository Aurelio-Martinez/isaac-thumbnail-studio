[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/catalog/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://bindingofisaacrebirth.wiki.gg https://bindingofisaacrebirth.fandom.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

# Do not add a redirect for /api/asset-proxy. The Netlify Function declares
# `config.path = "/api/asset-proxy"`, which disables its default
# /.netlify/functions/asset-proxy URL and routes the path directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
